
root = "."
testdata_dir = "testdata"
tmp_dir = ".build"

[build]
  args_bin = []
  bin = "./.build/gospin.exe"
  # Note: cmd.exe has no `$(...)` / `` ` `` shell substitution, so the
  # version -X ldflags from Taskfile.yml's VERSION_FLAGS cannot be inlined
  # here without brittle nested quoting. Run `task run` from a Git-Bash shell
  # on Windows instead — it expands the same flags through Task's own
  # variable resolution.
  cmd = "cmd /c \"go build -o ./.build/gospin.exe ./cmd/server/main.go\""
  delay = 1000
  exclude_dir = ["assets", ".build", "vendor", "testdata", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
