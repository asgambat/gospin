# Sole publisher for version tags: docker_build_push.yml handles branch and
# pull-request builds only, so a tag produces exactly one multi-arch build per
# registry instead of two racing on the same semver tags.
name: Docker Multi-Arch Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/tests.yml

  build-and-push:
    name: Build and Push Multi-Arch Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || cat .version)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GO_VERSION=$(go version | awk '{print $3}')
          {
            echo "VERSION=${VERSION}"
            echo "BUILD_TIME=${BUILD_TIME}"
            echo "GIT_COMMIT=${GIT_COMMIT}"
            echo "GO_VERSION=${GO_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: VERSION=${VERSION} BUILD_TIME=${BUILD_TIME} GIT_COMMIT=${GIT_COMMIT} GO_VERSION=${GO_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` is a moving pointer for consumers. While the app is pre-1.0
      # (major == 0) every release may be breaking, so `latest` follows all of
      # them; from 1.0.0 on it moves only on a minor/major tag (patch == 0), so
      # `docker pull ...:latest` does not silently pick up a bug-fix build.
      # Every release still publishes its immutable `X.Y.Z`, `X.Y` and `X`
      # tags, whatever happens to `latest`.
      - name: Classify release
        id: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          PATCH="${VERSION##*.}"
          if [ "$MAJOR" = "0" ] || [ "$PATCH" = "0" ]; then
            echo "moves_latest=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION moves latest: pre-1.0 release or minor/major tag"
          else
            echo "moves_latest=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a patch release after 1.0: latest stays where it is"
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gospin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.release.outputs.moves_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta-build.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta-build.outputs.VERSION }}
            BUILD_TIME=${{ steps.meta-build.outputs.BUILD_TIME }}
            GIT_COMMIT=${{ steps.meta-build.outputs.GIT_COMMIT }}
            GO_VERSION=${{ steps.meta-build.outputs.GO_VERSION }}
