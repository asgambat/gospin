name: Docker Multi-Arch Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/tests.yml

  build-and-push:
    name: Build and Push Multi-Arch Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || cat .version)
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GO_VERSION=$(go version | awk '{print $3}')
          {
            echo "VERSION=${VERSION}"
            echo "BUILD_TIME=${BUILD_TIME}"
            echo "GIT_COMMIT=${GIT_COMMIT}"
            echo "GO_VERSION=${GO_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Computed: VERSION=${VERSION} BUILD_TIME=${BUILD_TIME} GIT_COMMIT=${GIT_COMMIT} GO_VERSION=${GO_VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta-build.outputs.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta-build.outputs.VERSION }}
            BUILD_TIME=${{ steps.meta-build.outputs.BUILD_TIME }}
            GIT_COMMIT=${{ steps.meta-build.outputs.GIT_COMMIT }}
            GO_VERSION=${{ steps.meta-build.outputs.GO_VERSION }}
