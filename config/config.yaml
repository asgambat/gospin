server:
  port: 8080
  waiting_server_port: 8081
  shutdown_timeout_secs: 5
  read_timeout_secs: 10
  write_timeout_secs: 10
  idle_timeout_secs: 120
  request_timeout_millis: 1000    # per-request timeout applied to the API routes
data:
  file_path: ./config/data/config.json
  persist_interval_secs: 5
  scheduling_enabled: true        # Enable/disable automatic container start/stop according to schedules
  scheduling_poll_interval_secs: 30
  base_url: "http://localhost/"  # Base URL for container URL generation, supports $1 token
  spin_up_url: "http://localhost/"  # Base URL for container lazy startup URL generation, supports $1 token
  refresh_interval_secs: 60       # Interval for UI auto-refresh (seconds)
  stats_refresh_interval_secs: 120  # Interval for container stats refresh (seconds)
  system_monitor_mount_point: "/mnt/extSSD"
  actions_mode: "async"            # "sync" or "async" — how actions return results to the frontend
  actions_timeout_seconds: 30      # timeout for proxied HTTP action requests
misc:
  gin_mode: debug
  scheduling_timezone: Local
  runtime_type: docker  # possible values: memory, docker
  cors_allowed_origins: "*"
  log_level: debug
  cosmos_base_url: ""  # Base URL for Cosmos API (e.g., "https://cosmos.example.com")
  cosmos_token: ""     # Bearer token for Cosmos API authentication  
ghostboard:
  file_path: ""                        # defaults to <dir of data.file_path>/ghostboard.json
  clear_delay_secs: 300               # text is cleared this long after the last write or client disconnect
  max_text_bytes: 16777216            # largest decoded text per board (16 MiB); the request body limit derives from it
  persist_interval_secs: 2            # write interval for pending changes (a tick with no changes writes nothing)
  heartbeat_interval_secs: 25         # SSE keep-alive comment interval
  private_boards: []                  # boards that need the PIN for reading and writing; every other board stays public
  pin_hmac: ""                         # HMAC-SHA256 of the shared PIN: gb-cli pin-hash <pin>
  pin_secret: ""                       # set GO_SPIN_GHOSTBOARD_PIN_SECRET instead of writing it here
  session_ttl_secs: 28800             # how long an unlock stays valid (8 hours)
  pin_max_attempts: 5                 # failed attempts per client address before a lockout
  pin_lockout_secs: 60                # first lockout; it doubles on every further batch of failures
    

