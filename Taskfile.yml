version: '3'

vars:
  # Go configuration
  GO_CMD: go
  GO_TEST_FLAGS: -count=1

  # Binary output
  BIN_DIR: .build
  BINARY: gospin
  BINARY_CLI: gb-cli

  # Version metadata — shell-evaluated at task runtime
  VERSION_PKG: github.com/asgambat/gospin/internal/version
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || cat .version
  BUILD_TIME:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  GO_VERSION:
    sh: go version | awk '{print $3}'

  # Build metadata flags, shared by the server and the CLI so the two binaries
  # never disagree about the version.
  #
  # IMPORTANT: this is ONE of three duplicated sources for the same build
  # metadata. Keep all three in lockstep whenever you add/remove a flag:
  #   1. This block                            (consumed by build, build:fast,
  #                                             build:cli and run)
  #   2. .air.toml [build].cmd                  (consumed by `task watch`)
  #   3. Dockerfile `ARG` + `-X -ldflags` block (consumed by the docker tasks)
  VERSION_FLAGS: '-X {{.VERSION_PKG}}.Version={{.VERSION}} -X {{.VERSION_PKG}}.BuildTime={{.BUILD_TIME}} -X {{.VERSION_PKG}}.GitCommit={{.GIT_COMMIT}} -X {{.VERSION_PKG}}.GoVersion={{.GO_VERSION}}'
  VERSION_FLAGS_DEV: '-X {{.VERSION_PKG}}.Version=dev -X {{.VERSION_PKG}}.BuildTime={{.BUILD_TIME}} -X {{.VERSION_PKG}}.GitCommit={{.GIT_COMMIT}} -X {{.VERSION_PKG}}.GoVersion={{.GO_VERSION}}'
  LDFLAGS: '-s -w {{.VERSION_FLAGS}}'
  LDFLAGS_DEV: '-s -w {{.VERSION_FLAGS_DEV}}'

  # Docker configuration
  DOCKER_IMAGE: bassista/gospin
  DOCKER_TAG: latest

tasks:
  # ============================================================
  # Main tasks
  # ============================================================

  default:
    desc: Show available tasks
    cmds:
      - task --list-all
    silent: true

  # ============================================================
  # Setup tasks
  # ============================================================

  install:
    desc: Install dev tooling (air, used by `task watch`)
    cmds:
      - '{{.GO_CMD}} install github.com/air-verse/air@latest'

  # ============================================================
  # Build tasks
  # ============================================================

  build:
    desc: Build the gospin binary (runs lint + test first)
    cmds:
      - task: lint
      - task: test
      - mkdir -p {{.BIN_DIR}}
      - '{{.GO_CMD}} build -ldflags="{{.LDFLAGS}}" -trimpath -o {{.BIN_DIR}}/{{.BINARY}}{{exeExt}} ./cmd/server'
    sources:
      - cmd/server/**/*.go
      - internal/**/*.go
      - ui/**/*
    generates:
      - '{{.BIN_DIR}}/{{.BINARY}}{{exeExt}}'

  build:fast:
    desc: Build quickly without lint/test
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - '{{.GO_CMD}} build -ldflags="{{.LDFLAGS_DEV}}" -trimpath -o {{.BIN_DIR}}/{{.BINARY}}{{exeExt}} ./cmd/server'
    sources:
      - cmd/server/**/*.go
      - internal/**/*.go
    generates:
      - '{{.BIN_DIR}}/{{.BINARY}}{{exeExt}}'

  build:cli:
    desc: Build the gb-cli CLI (client of the plain-text board API)
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - '{{.GO_CMD}} build -ldflags="{{.LDFLAGS}}" -trimpath -o {{.BIN_DIR}}/{{.BINARY_CLI}}{{exeExt}} ./cmd/board'
    sources:
      - cmd/board/**/*.go
      - internal/boardclient/**/*.go
    generates:
      - '{{.BIN_DIR}}/{{.BINARY_CLI}}{{exeExt}}'

  # ============================================================
  # Run tasks
  # ============================================================

  run:
    desc: Run the application (go run with version metadata)
    cmds:
      - '{{.GO_CMD}} run -ldflags="{{.VERSION_FLAGS}}" ./cmd/server'

  watch:
    desc: Run with hot-reload via air (requires `go install github.com/air-verse/air@latest`)
    cmds:
      - air

  # ============================================================
  # Test tasks
  # ============================================================

  test:
    desc: Run all tests
    cmds:
      - '{{.GO_CMD}} test {{.GO_TEST_FLAGS}} ./...'

  test:verbose:
    desc: Run all tests with verbose output
    cmds:
      - '{{.GO_CMD}} test -v {{.GO_TEST_FLAGS}} ./...'

  test:race:
    desc: Run tests with race detector
    cmds:
      - '{{.GO_CMD}} test -race {{.GO_TEST_FLAGS}} ./...'

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - '{{.GO_CMD}} test -cover -coverprofile=coverage.out {{.GO_TEST_FLAGS}} ./...'
      - '{{.GO_CMD}} tool cover -html=coverage.out -o coverage.html'
      - cmd: echo "Coverage report generated at coverage.html"
        silent: true

  test:package:
    desc: 'Run tests for a specific package (usage: task test:package -- ./internal/config)'
    cmds:
      - '{{.GO_CMD}} test -v {{.GO_TEST_FLAGS}} {{.CLI_ARGS}}'

  # ============================================================
  # Documentation tasks
  # ============================================================

  screenshots:
    desc: Regenerate docs/screenshots from a demo instance (needs node; installs Playwright into .build on first run)
    cmds:
      - ./scripts/screenshots/capture.sh
    preconditions:
      - sh: command -v node
        msg: "node not found. Install Node.js from https://nodejs.org to drive the browser"

  # ============================================================
  # Code quality tasks
  # ============================================================

  fmt:
    desc: Format Go code
    cmds:
      - '{{.GO_CMD}} fmt ./...'

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO_CMD}} vet ./...'

  staticcheck:
    desc: Run staticcheck (covers the S1xxx checks golangci-lint does not enable)
    cmds:
      - staticcheck ./...
    preconditions:
      - sh: command -v staticcheck
        msg: "staticcheck not found. Install with: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1"

  lint:
    desc: Run staticcheck and golangci-lint
    cmds:
      - task: staticcheck
      - golangci-lint run --concurrency=1 ./...
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint not found. Install from https://golangci-lint.run/usage/install/"

  check:
    desc: Run all code quality checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # ============================================================
  # Dependency tasks
  # ============================================================

  deps:
    desc: Download and verify Go dependencies
    cmds:
      - '{{.GO_CMD}} mod download'
      - '{{.GO_CMD}} mod verify'

  deps:tidy:
    desc: Tidy Go dependencies
    cmds:
      - '{{.GO_CMD}} mod tidy'

  deps:update:
    desc: Check for direct dependency updates
    cmds:
      - "{{.GO_CMD}} list -u -m -f '{{`{{if not .Indirect}}{{.}}{{end}}`}}' all | grep '\\['"

  # ============================================================
  # Clean tasks
  # ============================================================

  clean:
    desc: Clean all build and test artifacts
    cmds:
      - cmd: rm -rf {{.BIN_DIR}}
        platforms: [linux, darwin]
        ignore_error: true
      - cmd: rmdir /s /q {{.BIN_DIR}}
        platforms: [windows]
        ignore_error: true
      - cmd: rm -f coverage.out coverage.html
        platforms: [linux, darwin]
        ignore_error: true

  # ============================================================
  # Docker tasks
  # ============================================================

  docker:build:
    desc: Build Docker image for current platform
    cmds:
      - docker buildx build -f Dockerfile --load -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} --progress plain .

  docker:buildx:
    desc: Build multi-arch image and push (linux/amd64 + linux/arm64)
    cmds:
      - docker buildx build -f Dockerfile --platform linux/amd64,linux/arm64 --cache-from type=registry,ref={{.DOCKER_IMAGE}}:cache --cache-to type=registry,ref={{.DOCKER_IMAGE}}:cache,mode=max -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} --progress plain --push .

  docker:push:
    desc: Push Docker image to registry
    cmds:
      - docker push {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  docker:run:
    desc: Run Docker container locally
    cmds:
      - docker run -d --name gospin -p 8084:8084 -p 8085:8085 -v /var/run/docker.sock:/var/run/docker.sock -v ./config:/app/config {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  docker:stop:
    desc: Stop and remove Docker container
    cmds:
      - cmd: docker stop gospin
        ignore_error: true
      - cmd: docker rm gospin
        ignore_error: true

  # ============================================================
  # CI/CD helper tasks
  # ============================================================

  ci:
    desc: Run CI pipeline (deps, lint, test, build)
    cmds:
      - task: deps
      - task: lint
      - task: test:race
      - task: build:fast

  release:
    desc: Build release binary
    cmds:
      - task: clean
      - task: build
      - cmd: echo "Release binary built at {{.BIN_DIR}}/{{.BINARY}}{{exeExt}}"
        silent: true

  # ============================================================
  # Version management
  # ============================================================

  version:show:
    desc: "Show the current version (source of truth: .version file)"
    cmds:
      - cmd: cat .version
        silent: true

  version:bump:
    desc: 'Bump version, commit, and tag (usage: task version:bump -- 0.0.13)'
    cmds:
      - bash .task/version_bump.sh "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task version:bump -- <new-version>  (e.g. task version:bump -- 0.0.13)"
